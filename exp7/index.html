<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="dashboard">
        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Check the current weather in any city</p>

        <div class="search">
            <input id="city" type="text" placeholder="Enter city" value="Mumbai">
            <button type="button" onclick="getWeather()">Search</button>
        </div>

        <section id="weather" class="weather-card">
            <h2>Weather Information</h2>
            <p id="result">Enter a city and click Search.</p>
        </section>
    </main>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            if (!city) {
                result.textContent = "Please enter a city.";
                return;
            }

            result.textContent = "Loading...";

            try {
                const geoResponse = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`
                );
                if (!geoResponse.ok) throw new Error("Location request failed");
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    result.textContent = "City not found. Please try another city.";
                    return;
                }

                const location = geoData.results[0];
                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`
                );
                if (!weatherResponse.ok) throw new Error("Weather request failed");
                const weatherData = await weatherResponse.json();
                const current = weatherData.current;

                result.innerHTML = `
                    <div class="city-name">${location.name}${location.country ? ", " + location.country : ""}</div>
                    <div class="weather-item"><span>🌡️ Temperature</span><strong>${current.temperature_2m} °C</strong></div>
                    <div class="weather-item"><span>💧 Humidity</span><strong>${current.relative_humidity_2m}%</strong></div>
                    <div class="weather-item"><span>💨 Wind Speed</span><strong>${current.wind_speed_10m} km/h</strong></div>
                `;
            } catch (error) {
                result.textContent = "❌ Error fetching weather data. Check your internet connection and try again.";
                console.error(error);
            }
        }

        document.getElementById("city").addEventListener("keydown", (event) => {
            if (event.key === "Enter") getWeather();
        });
    </script>
</body>
</html>
